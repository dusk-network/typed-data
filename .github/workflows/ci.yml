name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test and compare vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build, run coverage, compare built vectors and check the approval example
        run: npm run ci

      - name: Compare frozen BLS vectors with the locked Rust emitter
        run: npm run test:bls-native
